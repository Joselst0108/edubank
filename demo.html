<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduBank — Banco escolar</title>
<style>
:root{--r:#d62839;--b:#17398c;--b2:#2f5fd0;--bg:#f2f5fb;--t:#1c2440;--mu:#6b7599}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
button,input,select{font:inherit}h1,h2,h3{margin:0 0 10px}.mu{color:var(--mu);font-size:.85rem}
.shell{display:flex;min-height:100vh}.side{width:240px;background:linear-gradient(180deg,var(--b),#0e2461);color:#fff;padding:16px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{font-size:1.5rem;font-weight:800;margin-bottom:4px}.logo b{color:#ff6b7a}.side small{opacity:.7}
.side a{display:block;padding:10px 12px;margin:3px 0;border-radius:10px;color:#dfe7ff;cursor:pointer;font-size:.95rem}.side a:hover{background:#ffffff1f}.side a.on{background:#fff;color:var(--b);font-weight:700;box-shadow:inset 4px 0 var(--r)}
.main{flex:1;padding:20px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}.burger{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #1737a014;animation:up .4s}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.kpi .v{font-size:1.6rem;font-weight:800;color:var(--b)}.kpi.red .v{color:var(--r)}
.btn{background:var(--b);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.red{background:var(--r)}.btn.ghost{background:#e8eefc;color:var(--b)}.btn.sm{padding:5px 10px;font-size:.8rem}.btn.big{font-size:1.2rem;padding:16px 26px;box-shadow:0 6px 16px #d6283955}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px;border-bottom:1px solid #e8ecf6}th{color:var(--mu);font-size:.78rem;text-transform:uppercase}.sc{overflow-x:auto}
.pos{color:#12915a;font-weight:700}.neg{color:var(--r);font-weight:700}
.bar{background:#e6ebf7;border-radius:99px;height:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b2),var(--r));border-radius:99px;transition:width .6s}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;background:#e8eefc;color:var(--b)}.tag.r{background:#fde6e9;color:var(--r)}.tag.g{background:#dff5ea;color:#12915a}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem}.ck{font-weight:400;margin:4px 0}input:not([type=checkbox]):not([type=radio]),select{width:100%;padding:10px;border:1px solid #cfd7ee;border-radius:10px}
#m{position:fixed;inset:0;background:#0a1230aa;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}#m.on{display:flex}#m .card{width:100%;max-width:460px;max-height:92vh;overflow:auto}
#t{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10}#t div{background:var(--b);color:#fff;padding:10px 18px;border-radius:10px;margin-top:6px;box-shadow:0 4px 14px #0004}#t .er{background:var(--r)}
.hero{background:linear-gradient(135deg,var(--b),var(--b2) 60%,var(--r));color:#fff}.hero .v{font-size:2.3rem;font-weight:800}.hero .bar{background:#ffffff40}.hero .bar i{background:#fff}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:104px;padding:10px;margin:4px;border-radius:14px;background:#fff6dc;text-align:center;font-size:.78rem}.badge.off{filter:grayscale(1);opacity:.4;background:#eee}.badge span{font-size:2rem}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--b),#0e2461 55%,var(--r));padding:14px}.login .card{max-width:420px;width:100%}
.demo{background:#fff3cd;color:#7a5b00;padding:8px 10px;border-radius:10px;font-size:.82rem;margin:10px 0}.tabs{display:flex;gap:6px}.tabs button{flex:1}
.ini .big{font-size:3rem;word-break:break-all}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem}.flow b{background:#e8eefc;color:var(--b);padding:4px 8px;border-radius:8px}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.85rem}.hb .bar{flex:1}
@media(max-width:800px){.side{position:fixed;left:-260px;z-index:8;transition:.25s;height:100%}.side.on{left:0}.burger{display:inline-block}.main{padding:12px}}
</style></head><body><div id="app"></div><div id="m"></div><div id="t"></div>
<script>
/* ===== CAPA DE DATOS (reemplazable por Supabase/API) ===== */
const K='edubank_v1',DB={load(){try{return JSON.parse(localStorage.getItem(K))}catch(x){return null}},save(s){localStorage.setItem(K,JSON.stringify(s))},reset(){localStorage.removeItem(K)}};
const $=i=>document.getElementById(i),r2=n=>Math.round(n*100)/100,f=n=>'E$ '+Number(n).toFixed(2),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>new Date(d).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'});
const INK=['Premio','Bono','Participación','Asistencia','Tarea','Logro','Conducta','Incentivo','Otro','Préstamo','Reto'];
const LV=[[0,'Explorador financiero'],[100,'Ahorrador'],[250,'Administrador'],[500,'Emprendedor'],[900,'Maestro financiero']];
const lv=p=>{let i=0;LV.forEach((l,k)=>{if(p>=l[0])i=k});return i};
const ACH=[['🏆','Primer ahorro',(s,c)=>c.ah>0],['🥇','Ahorrador constante',(s,c)=>c.ah>=3],['🤝','Primer préstamo pagado',(s,c)=>c.lp>0],['🔟','10 operaciones realizadas',(s,c)=>c.n>=10],['🧠','Buen administrador',s=>s.pts>=300],['🎯','Meta alcanzada',s=>s.goal&&s.sav>=s.goal.target],['🚀','Emprendedor escolar',(s,c)=>c.cp>=2]];
const LES=[['¿Qué es ahorrar?','Ahorrar es guardar una parte de lo que recibes hoy para usarla después.','Si recibes E$10 y guardas E$3, ¿qué haces?',['Ahorrar','Gastar todo'],0],['¿Qué es gastar?','Gastar es usar tu dinero para obtener algo. Conviene gastar con cuidado.','Antes de gastar conviene…',['Pensar si lo necesito','Comprar lo primero que veo'],0],['¿Qué es un presupuesto?','Es un plan que anota cuánto ingresa y cuánto piensas gastar.','Un presupuesto sirve para…',['Planificar mi dinero','Adivinar el futuro'],0],['¿Qué es un préstamo?','Es dinero que se recibe y se debe devolver en un plazo acordado.','Un préstamo se debe…',['Devolver','Olvidar'],0],['¿Qué es una deuda?','Es lo que debes devolver. Pagar a tiempo genera confianza.','Pagar a tiempo es…',['Responsabilidad','Opcional'],0],['¿Qué es una meta financiera?','Es un objetivo con cantidad y fecha, como ahorrar para un proyecto.','Una meta necesita…',['Cantidad y fecha','Solo suerte'],0],['¿Necesidad o deseo?','Necesidad: lo indispensable. Deseo: lo que queremos pero podemos esperar.','Un cuaderno para clase es…',['Necesidad','Deseo'],0],['¿Cómo administrar mi dinero?','Regla simple: una parte para ahorrar, otra para gastar y anota todo.','Lo primero es…',['Anotar mis ingresos y gastos','Gastar rápido'],0]];
let S=DB.load(),me=JSON.parse(sessionStorage.eb||'null'),view='',flt={s:'',k:''},role0='docente';
function seed(){
 S={tre:10000,tre0:10000,cfg:{initial:0,rank:true,market:true,loans:true,maxLoan:200,rate:5,interes:0,tope:500},schools:['I.E.P. Corazón de Santa María'],teachers:[{name:'Profesor José',u:'docente'}],aulas:['5.º Primaria A','Inicial 5 años'],
 users:[{u:'admin',p:'1234',role:'admin',name:'Administrador'},{u:'docente',p:'1234',role:'docente',name:'Profesor José'},{u:'alumno',p:'1234',role:'alumno',sid:1,name:'Ana Torres'},{u:'inicial',p:'1234',role:'alumno',sid:6,name:'Mateo Díaz'}],
 students:['Ana Torres','Carlos López','María Pérez','Luis García','Sofía Ramos'].map((n,i)=>({id:i+1,name:n,aula:'5.º Primaria A',nivel:'Primaria',bal:0,sav:0,pts:[950,900,850,420,300][i]/3|0,goal:null,done:[],les:[]})).concat([{id:6,name:'Mateo Díaz',aula:'Inicial 5 años',nivel:'Inicial',bal:0,sav:0,pts:60,goal:null,done:[],les:[]}]),
 tx:[],loans:[],reqs:[],rewards:[['🍎','Ser ayudante del profesor',20],['📚','Elegir una actividad',30],['🎮','15 minutos de actividad libre',40],['⭐','Reconocimiento especial',50],['🎨','Elegir material de clase',60]].map((x,i)=>({id:i+1,icon:x[0],name:x[1],cost:x[2],on:true})),
 chal:[{id:1,name:'Ahorrar E$20 esta semana',rew:10,pts:30},{id:2,name:'Evitar gastar durante 3 días',rew:8,pts:25},{id:3,name:'Registrar mis gastos',rew:5,pts:15},{id:4,name:'Completar mi meta',rew:20,pts:50}]};
 me=null;const sd=[[1,'Tarea',100,'Cumplimiento de tareas',9],[1,'Participación',60,'Premio por participación',7],[1,'Bono',50,'Bono del docente',5],[1,'Asistencia',40,'Asistencia perfecta',3],[1,'Compra',80,'Compra de recompensa',2],[2,'Tarea',90,'Cumplimiento de tareas',8],[2,'Premio',60,'Premio por orden',4],[2,'Compra',40,'Compra de recompensa',1],[3,'Participación',150,'Premio por participación',6],[3,'Bono',40,'Bono del docente',3],[4,'Asistencia',50,'Asistencia perfecta',5],[4,'Reposición',10,'Reposición de material dañado',2],[5,'Tarea',45,'Cumplimiento de tareas',4],[6,'Logro',15,'Primer día de clases',6]];
 sd.forEach(x=>{op(x[0],x[1],x[2],x[3],Date.now()-x[4]*864e5)});S.students[0].sav=40;S.students[0].goal={name:'Materiales de proyecto',target:100,date:'2026-12-15'};S.students[1].sav=20;
 [[1,1],[1,1],[2,1]].forEach(x=>S.tx.push({id:uid(),d:new Date(Date.now()-864e5).toISOString(),by:'Profesor José',sid:x[0],kind:'Ahorro',amt:0,b:0,a:0,why:'Ahorro'}));
 S.loans.push({id:uid(),sid:3,amt:30,why:'Comprar materiales para mi proyecto',days:10,st:'pending',d:new Date().toISOString()});S.last=null;save()}
function save(){DB.save(S)}
if(!S)seed();S.cfg=Object.assign({rate:5,interes:0,tope:500},S.cfg);S.bono=S.bono||'';
/* ===== LÓGICA ECONÓMICA: toda operación pasa por op() ===== */
function op(sid,kind,amt,why,date){
 amt=r2(parseFloat(amt));if(!(amt>0)||amt>100000)throw'Cantidad inválida';
 const st=S.students.find(x=>x.id==sid);if(!st)throw'Estudiante no encontrado';
 const inn=INK.includes(kind),k=[sid,kind,amt,why].join('|'),now=Date.now();
 if(S.last&&S.last.k==k&&now-S.last.t<1500&&!date)throw'Operación duplicada, espera un momento';
 if(inn&&amt>S.tre)throw'Tesorería sin fondos suficientes (disponible '+f(S.tre)+')';
 if(!inn&&amt>r2(st.bal-st.sav))throw'Saldo disponible insuficiente';
 const b=st.bal;st.bal=r2(b+(inn?amt:-amt));S.tre=r2(S.tre+(inn?-amt:amt));
 S.tx.unshift({id:uid(),d:new Date(date||now).toISOString(),by:me?me.name:'Sistema',sid:st.id,kind,amt:inn?amt:-amt,b,a:st.bal,why});
 S.last={k,t:now};save()}
const stu=id=>S.students.find(x=>x.id==id),avail=s=>r2(s.bal-s.sav);
const txOf=id=>S.tx.filter(t=>t.sid==id);
function ctx(s){const t=txOf(s.id);return{ah:t.filter(x=>x.kind=='Ahorro').length,n:t.length,lp:S.loans.filter(l=>l.sid==s.id&&l.st=='paid').length,cp:S.reqs.filter(q=>q.sid==s.id).length}}
const got=(s)=>ACH.map(a=>[a,a[2](s,ctx(s))]);
const sum=a=>r2(a.reduce((x,y)=>x+y,0));
function toast(m,er){const d=document.createElement('div');d.textContent=m;if(er)d.className='er';$('t').appendChild(d);setTimeout(()=>d.remove(),3200)}
function go(fn,ok){try{fn();if(ok)toast(ok)}catch(x){toast(typeof x=='string'?x:'Error inesperado',1);console.error(x)}render()}
function modal(h){$('m').innerHTML='<div class="card"><div class="btns" style="justify-content:space-between"><b></b><button class="btn ghost sm" onclick="cm()">✕ Cerrar</button></div>'+h+'</div>';$('m').className='on'}
const cm=()=>$('m').className='';
/* ===== LOGIN ===== */
function loginH(){return`<div class="login"><div class="card"><div class="logo" style="color:var(--b)">Edu<b style="color:var(--r)">Bank</b></div><p class="mu">Banco escolar virtual · parte de EduSistema</p>
<div class="tabs">${[['admin','Administrador'],['docente','Docente'],['alumno','Estudiante']].map(r=>`<button class="btn ${role0==r[0]?'':'ghost'} sm" onclick="role0='${r[0]}';render()">${r[1]}</button>`).join('')}</div>
<label>Usuario</label><input id="lu" value="${role0}"><label>Contraseña</label><input id="lp" type="password" value="1234" onkeydown="if(event.key=='Enter')login()"><div class="btns"><button class="btn red" style="width:100%" onclick="login()">Ingresar</button></div>
<div class="demo">⚠️ Cuentas DEMO: admin / docente / alumno / inicial — clave 1234. Los EduSoles NO son dinero real.</div></div></div>`}
function login(){const u=S.users.find(x=>x.u==$('lu').value.trim()&&x.p==$('lp').value);if(!u||u.role!=role0)return toast('Usuario, clave o perfil incorrecto',1);me=u;sessionStorage.eb=JSON.stringify(u);view='';render()}
const out=()=>{me=null;sessionStorage.removeItem('eb');render()};
/* ===== MENÚS ===== */
const NAV={admin:[['dash','🏠','Resumen'],['sch','🏫','Colegios'],['tch','👩‍🏫','Docentes'],['est','🎓','Estudiantes'],['mov','📒','Movimientos'],['cfg','⚙️','Configuración']],
docente:[['dash','🏠','Dashboard'],['tre','🏦','Tesorería'],['est','🎓','Estudiantes'],['aul','🏫','Aulas'],['ent','➕','Entregar EduSoles'],['mov','📒','Movimientos'],['pre','🤝','Préstamos'],['mkt','🛍️','EduMarket'],['ret','🎯','Retos'],['log','🏆','Logros'],['rep','📊','Reportes'],['cfg','⚙️','Configuración']],
alumno:[['dash','🏠','Inicio'],['sal','💰','Mi saldo'],['mov','📒','Movimientos'],['aho','🐷','Ahorrar'],['mkt','🛍️','Recompensas'],['pre','🤝','Préstamos'],['met','🎯','Mis metas'],['log','🏆','Mis logros'],['ret','⚡','Retos'],['edu','📘','Educación financiera']],
ini:[['dash','🏠','Inicio'],['sal','🪙','Mis monedas'],['log','🏆','Mis logros'],['mkt','🎁','Mis premios']]};
const navOf=()=>{if(me.role!='alumno')return NAV[me.role];const n=stu(me.sid).nivel;return n=='Inicial'?NAV.ini:n=='Secundaria'?NAV.alumno.slice(0,6).concat([['pres','📋','Mi presupuesto']],NAV.alumno.slice(6)):NAV.alumno};
function render(){
 if(!me){$('app').innerHTML=loginH();return}
 const nv=navOf();if(!view||!nv.find(n=>n[0]==view))view='dash';
 let h;try{h=V[me.role=='alumno'?'alumno':'staff'](view)}catch(x){h='<div class="card">Error: '+e(x.message||x)+'</div>';console.error(x)}
 $('app').innerHTML=`<div class="shell"><nav class="side" id="sd"><div class="logo">Edu<b>Bank</b></div><small>${e(S.schools[0])}</small><div style="height:14px"></div>${nv.map(n=>`<a class="${view==n[0]?'on':''}" onclick="nav('${n[0]}')">${n[1]} ${n[2]}</a>`).join('')}</nav>
 <div class="main"><div class="top"><button class="btn ghost burger" onclick="$('sd').classList.toggle('on')">☰</button><div><b>${e(me.name)}</b> <span class="tag">${{admin:'Administrador',docente:'Docente / Tesorero',alumno:'Estudiante'}[me.role]}</span></div><button class="btn ghost sm" onclick="out()">Salir</button></div>${h}</div></div>`}
function nav(v){if(v=='ent'){view='tre';give()}else view=v;$('sd')&&$('sd').classList.remove('on');render()}
const kpi=(t,v,s,c)=>`<div class="card kpi ${c||''}"><div class="mu">${t}</div><div class="v">${v}</div><div class="mu">${s||''}</div></div>`;
const tb=(hd,rows)=>`<div class="sc"><table><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${hd.length} class="mu">Sin datos</td></tr>`}</table></div>`;
const hb=(l,v,m)=>`<div class="hb"><span style="width:110px">${e(l)}</span><div class="bar"><i style="width:${m?Math.min(100,v/m*100):0}%"></i></div><b>${v}</b></div>`;
const txRows=(a,nm)=>a.map(t=>[fd(t.d),...(nm?[e(stu(t.sid)?.name)]:[]),`<span class="tag">${t.kind}</span>`,`<span class="${t.amt>=0?'pos':'neg'}">${t.amt>=0?'+':'−'}${f(Math.abs(t.amt))}</span>`,f(t.b),f(t.a),e(t.why),e(t.by)]);
const TH=nm=>['Fecha',...(nm?['Estudiante']:[]),'Tipo','Monto','Saldo ant.','Saldo post.','Motivo','Por'];
const stats=()=>{const T=S.tx,m=new Date().getMonth();return{ent:sum(T.filter(t=>INK.includes(t.kind)&&t.kind!='Préstamo').map(t=>t.amt)),mes:sum(T.filter(t=>t.amt>0&&new Date(t.d).getMonth()==m).map(t=>t.amt)),ret:sum(T.filter(t=>['Retiro','Reposición','Multa'].includes(t.kind)).map(t=>-t.amt)),gas:sum(T.filter(t=>t.kind=='Compra').map(t=>-t.amt)),sav:sum(S.students.map(s=>s.sav)),dist:sum(S.students.map(s=>s.bal)),la:S.loans.filter(l=>l.st=='active').length,lp:S.loans.filter(l=>l.st=='pending').length}};
const rank=()=>S.cfg.rank?`<div class="card"><h3>🏅 Ranking de puntos financieros</h3>${[...S.students].sort((a,b)=>b.pts-a.pts).slice(0,5).map((s,i)=>`<div>${['🥇','🥈','🥉','4.º','5.º'][i]} ${e(s.name)} — <b>${s.pts} puntos</b></div>`).join('')}<p class="mu">No se muestran saldos.</p></div>`:'';
/* ===== VISTAS DOCENTE / ADMIN ===== */
const V={staff(v){const s=stats(),adm=me.role=='admin';switch(v){
case'dash':return`<h2>${adm?'Resumen general':'Dashboard del docente'}</h2><div class="grid">${kpi('Tesorería disponible',f(S.tre),'Fuente controlada')}${kpi('Estudiantes',S.students.length)}${kpi('EduSoles en cuentas',f(s.dist),'',  'red')}${kpi('Préstamos activos',s.la,s.lp+' pendientes')}</div><div class="card"><h3>Últimos movimientos</h3>${tb(TH(1),txRows(S.tx.filter(t=>t.kind!='Ahorro').slice(0,8),1))}</div>`+(adm?'':'<div style="height:14px"></div>'+rank());
case'tre':return`<h2>🏦 Tesorería EduBank</h2><div class="grid">${kpi('Saldo total administrado',f(S.tre+s.dist),'Tesorería + estudiantes')}${kpi('En Tesorería',f(S.tre))}${kpi('Estudiantes',S.students.length)}${kpi('EduSoles distribuidos',f(s.dist),'','red')}${kpi('Entregados este mes',f(s.mes))}${kpi('EduSoles retirados',f(s.ret))}${kpi('Préstamos activos',s.la)}${kpi('Préstamos pendientes',s.lp)}${kpi('Circulación',Math.round(s.dist/((S.tre+s.dist)||1)*100)+'%',s.dist/((S.tre+s.dist)||1)>.7?'⚠️ Alta: riesgo de inflación':'Saludable')}</div>
<div class="card"><div class="btns"><button class="btn red big" onclick="give()">+ ENTREGAR EDUSOLES</button><button class="btn" onclick="give('a')">ENTREGAR A TODA EL AULA</button><button class="btn" onclick="give('v')">ENTREGAR A VARIOS ESTUDIANTES</button><button class="btn ghost" onclick="bonoAhorro()">🐷 Pagar bonificación por ahorro</button></div><div class="flow"><b>TESORERÍA</b>→<b>DISTRIBUCIÓN</b>→<b>ESTUDIANTE</b>→<b>AHORRO / GASTO / PRÉSTAMO</b>→<b>RECOMPENSA / DEVOLUCIÓN</b>→<b>REGISTRO</b></div><p class="mu">Los EduSoles solo salen de la Tesorería y los gastos regresan a ella. Nunca se crea dinero de la nada.</p></div><div style="height:14px"></div><div class="card"><h3>Últimas operaciones</h3>${tb(TH(1),txRows(S.tx.slice(0,6),1))}</div>`;
case'est':return`<h2>🎓 Estudiantes</h2>${adm?'<button class="btn" onclick="newStu()">+ Nuevo estudiante</button><div style="height:12px"></div>':''}<div class="card">${tb(['Nombre','Aula','Nivel','Saldo','Ahorro','Disponible','Puntos','Acciones'],S.students.map(x=>[e(x.name),e(x.aula),x.nivel,f(x.bal),f(x.sav),f(avail(x)),x.pts,adm?'—':(x.nivel=='Inicial'?`<button class="btn sm ghost" onclick="star(${x.id})">⭐ Estrella</button> `:'')+`<button class="btn sm" onclick="give('u',${x.id})">Entregar</button> <button class="btn sm red" onclick="wd(${x.id})">Retirar</button>`]))}</div>`;

V.alumno=function(v){const s=stu(me.sid),c=ctx(s),t=txOf(s.id).filter(x=>x.kind!='Ahorro'),gan=sum(t.filter(x=>x.amt>0).map(x=>x.amt)),gas=sum(t.filter(x=>x.amt<0).map(x=>-x.amt)),L=lv(s.pts),nx=LV[L+1],pc=nx?(s.pts-LV[L][0])/(nx[0]-LV[L][0])*100:100,ini=s.nivel=='Inicial';
const hero=`<div class="card hero"><div>Mi saldo</div><div class="v">${f(s.bal)}</div><div>Nivel ${L+1} — ${LV[L][1]} · ${s.pts} pts</div><div class="bar" style="margin:8px 0"><i style="width:${pc}%"></i></div></div>`;
switch(v){
case'dash':if(ini)return`<div class="ini"><div class="card hero"><h2>¡Hola, ${e(s.name.split(' ')[0])}! 👋</h2></div><div class="grid" style="margin-top:14px"><div class="card"><h3>🪙 Mis monedas</h3><div class="big">${'🪙'.repeat(Math.min(20,Math.round(s.bal/5)))||'—'}</div><b>${Math.round(s.bal)} monedas</b></div><div class="card"><h3>⭐ Mis estrellas</h3><div class="big">${'⭐'.repeat(Math.min(10,Math.ceil(s.pts/10)))}</div></div><div class="card"><h3>🏆 Mis logros</h3><div class="big">${'🏆'.repeat(Math.max(1,got(s).filter(x=>x[1]).length))}</div></div><div class="card"><h3>🎁 Mis premios</h3><div class="big">${'🎁'.repeat(S.reqs.filter(q=>q.sid==s.id).length)||'🎁'}</div></div></div></div>`;
return`<h2>¡Hola, ${e(s.name.split(' ')[0])}!</h2>${hero}<div class="grid">${kpi('Disponible',f(avail(s)))}${kpi('Ahorrado',f(s.sav))}${kpi('Ganado',f(gan))}${kpi('Gastado',f(gas),'','red')}</div><div class="btns">${[['aho','🐷 Ahorrar'],['mkt','🎁 Recompensas'],['pre','💸 Solicitar préstamo'],['pre','📄 Mis préstamos'],['edu','📘 Educación financiera'],['log','🏆 Mis logros']].map(b=>`<button class="btn ghost" onclick="nav('${b[0]}')">${b[1]}</button>`).join('')}</div>${s.nivel=='Secundaria'?`<div class="card"><h3>📈 Análisis financiero</h3>${hb('Ingresos',gan,Math.max(gan,gas,1))}${hb('Gastos',gas,Math.max(gan,gas,1))}${hb('Ahorro',s.sav,Math.max(gan,gas,1))}<p class="mu">Ahorras el ${gan?Math.round(s.sav/gan*100):0}% de tus ingresos. Deuda pendiente: ${f(sum(S.loans.filter(l=>l.sid==s.id&&l.st=='active').map(l=>l.amt)))}</p></div>`:''}<div class="card"><h3>Últimos movimientos</h3>${tb(['Fecha','Tipo','Monto','Motivo'],txRows(t.slice(0,5)).map(r=>[r[0],r[1],r[2],r[6]]))}</div>`;
case'sal':return`<h2>${ini?'🪙 Mis monedas':'💰 Mi saldo'}</h2>${hero}<div class="grid">${kpi('Saldo total',f(s.bal))}${kpi('Ahorrado',f(s.sav))}${kpi('Disponible',f(avail(s)))}${kpi('Dinero ganado',f(gan))}${kpi('Dinero gastado',f(gas),'','red')}</div>`;
case'mov':return`<h2>📒 Mis movimientos</h2><div class="card">${tb(TH(0),txRows(txOf(s.id)))}</div>`;
case'aho':return`<h2>🐷 Mi ahorro</h2><div class="grid">${kpi('Saldo',f(s.bal))}${kpi('Ahorro',f(s.sav))}${kpi('Disponible',f(avail(s)))}</div><div class="card"><label>Cantidad (E$)</label><input id="sa" type="number" min="1"><div class="btns"><button class="btn" onclick="sv(1)">Quiero ahorrar</button><button class="btn red" onclick="sv(-1)">Sacar de mi ahorro</button></div></div><div style="height:14px"></div>${goalH(s)}`;
case'met':return`<h2>🎯 Mis metas</h2>${goalH(s)}<div class="card"><h3>${s.goal?'Cambiar':'Crear'} meta</h3><label>Nombre</label><input id="gn"><label>Cantidad objetivo (E$)</label><input id="gt" type="number" min="1"><label>Fecha objetivo</label><input id="gd" type="date"><div class="btns"><button class="btn" onclick="setGoal()">Guardar meta</button></div></div>`;
case'mkt':if(ini)return`<h2>🎁 Mis premios</h2><div class="card"><div class="big" style="font-size:3rem">${S.reqs.filter(q=>q.sid==s.id).map(q=>q.name?'🎁':'').join('')||'🎁'}</div><p>¡Pide a tu profesor tus premios!</p></div>`;
return`<h2>🛍️ EduMarket</h2><p>Disponible: <b>${f(avail(s))}</b></p>${S.cfg.market?'':'<div class="demo">EduMarket está desactivado por el administrador.</div>'}<div class="grid">${S.rewards.filter(x=>x.on).map(x=>`<div class="card"><div style="font-size:2rem">${e(x.icon)}</div><b>${e(x.name)}</b><div class="pos">${f(x.cost)}</div><button class="btn sm red" ${S.cfg.market?'':'disabled'} onclick="buy(${x.id})">Comprar</button></div>`).join('')}</div><div class="card"><h3>Mis compras</h3>${tb(['Fecha','Recompensa','Estado'],S.reqs.filter(q=>q.sid==s.id).map(q=>[fd(q.d),e(q.name),q.st=='done'?'<span class="tag g">Entregada</span>':'<span class="tag">Esperando al docente</span>']))}</div>`;
case'pre':{const open=S.loans.find(l=>l.sid==s.id&&['pending','active'].includes(l.st));return`<h2>🤝 Préstamos</h2>${S.cfg.loans&&!open?`<div class="card"><h3>Solicitar préstamo</h3><label>Monto (máx. ${f(S.cfg.maxLoan)})</label><input id="la" type="number" min="1"><label>Motivo</label><input id="lw" placeholder="Comprar materiales para mi proyecto"><label>Plazo (días)</label><input id="ld" type="number" min="1" max="60" value="10"><div class="btns"><button class="btn" onclick="askL()">Enviar solicitud</button></div></div>`:`<div class="demo">${open?'Ya tienes un préstamo en curso.':'Los préstamos están desactivados.'}</div>`}<div style="height:14px"></div><div class="card"><h3>Mis préstamos</h3>${tb(['Monto','Motivo','Plazo','Estado'],S.loans.filter(l=>l.sid==s.id).map(l=>[f(l.amt),e(l.why),l.days+' días',{pending:'Pendiente',active:'Activo',paid:'Pagado',rejected:'Rechazado'}[l.st]]))}</div><p class="mu">Tu docente registrará la devolución. Pagar a tiempo suma puntos.</p>`}
case'log':return`<h2>🏆 Mis logros</h2><div class="card">${got(s).map(g=>`<div class="badge ${g[1]?'':'off'}"><span>${g[0][0]}</span>${g[0][1]}</div>`).join('')}</div><div style="height:14px"></div>${rank()}`;
case'ret':return`<h2>⚡ Retos</h2><div class="grid">${S.chal.map(c=>{const d=s.done.includes(c.id);return`<div class="card"><b>${e(c.name)}</b><p class="pos">+${f(c.rew)} · +${c.pts} pts · 🏅</p><button class="btn sm ${d?'ghost':''}" ${d?'disabled':''} onclick="doCh(${c.id})">${d?'✓ Completado':'Marcar como completado'}</button></div>`}).join('')}</div>`;
case'pres':{const p=s.pres||{n:50,d:30,a:20},pa=gan?Math.round(s.sav/gan*100):0,pg=gan?Math.round(gas/gan*100):0;return`<h2>📋 Mi presupuesto</h2><div class="card"><p>Ingresos del período: <b>${f(gan)}</b>. Regla sugerida: 50% necesidades · 30% deseos · 20% ahorro.</p><label>Necesidades %</label><input id="pn" type="number" value="${p.n}"><label>Deseos %</label><input id="pd" type="number" value="${p.d}"><label>Ahorro %</label><input id="pa" type="number" value="${p.a}"><div class="btns"><button class="btn" onclick="savePres()">Guardar plan</button></div></div><div style="height:14px"></div><div class="card"><h3>Plan vs realidad</h3>${hb('Plan: ahorro %',p.a,100)}${hb('Real: ahorro %',pa,100)}${hb('Plan: gasto %',p.n+p.d,100)}${hb('Real: gasto %',pg,100)}<p>${pa>=p.a?'👏 Estás cumpliendo tu plan de ahorro.':'💡 Ahorras menos de lo planeado. Revisa tus deseos antes de comprar.'}</p></div>`}
case'edu':return`<h2>📘 Educación financiera</h2>${LES.map((l,i)=>`<div class="card" style="margin-bottom:12px"><h3>${l[0]} ${s.les.includes(i)?'<span class="tag g">✓ Completada</span>':''}</h3><p>${l[1]}</p><b>${l[2]}</b>${l[3].map((o,k)=>`<label class="ck"><input type="radio" name="q${i}" value="${k}"> ${o}</label>`).join('')}<button class="btn sm" onclick="ans(${i})">Responder</button></div>`).join('')}`}};
const goalH=s=>s.goal?`<div class="card"><h3>🎯 ${e(s.goal.name)}</h3><div class="bar"><i style="width:${Math.min(100,s.sav/s.goal.target*100)}%"></i></div><p>${f(s.sav)} de ${f(s.goal.target)} — <b>${Math.min(100,Math.round(s.sav/s.goal.target*100))}%</b> · Fecha objetivo: ${e(s.goal.date||'—')}</p></div>`:'<div class="card mu">Aún no tienes una meta. Crea una en "Mis metas".</div>';
/* ===== ACCIONES ===== */
const val=i=>$(i).value.trim();
function star(id){go(()=>{stu(id).pts+=10;save()},'⭐ Estrella entregada')}
function savePres(){go(()=>{const n=+val('pn'),d=+val('pd'),a=+val('pa');if([n,d,a].some(x=>!(x>=0))||n+d+a!=100)throw'Los porcentajes deben sumar 100';stu(me.sid).pres={n,d,a};save()},'Plan guardado')}
function bonoAhorro(){go(()=>{const w=new Date().getFullYear()+'-'+Math.ceil((Date.now()-new Date(new Date().getFullYear(),0,1))/6048e5);if(S.bono==w)throw'La bonificación de esta semana ya fue pagada';const l=S.students.filter(x=>x.sav>0).map(x=>[x,r2(x.sav*S.cfg.rate/100)]).filter(x=>x[1]>=0.1);if(!l.length)throw'Nadie tiene ahorro suficiente';const tot=r2(sum(l.map(x=>x[1])));if(tot>S.tre)throw'Tesorería sin fondos';if(!confirm('Pagar '+f(tot)+' ('+S.cfg.rate+'% del ahorro) a '+l.length+' estudiantes?'))throw'Operación cancelada';l.forEach(x=>{op(x[0].id,'Incentivo',x[1],'Bonificación semanal por ahorro ('+S.cfg.rate+'%)');x[0].pts+=5});S.bono=w;save()},'Bonificación pagada')}
function sv(d){go(()=>{const s=stu(me.sid),a=r2(parseFloat(val('sa')));if(!(a>0))throw'Cantidad inválida';if(d>0&&a>avail(s))throw'No tienes saldo disponible suficiente';if(d<0&&a>s.sav)throw'No tienes tanto ahorro';s.sav=r2(s.sav+d*a);S.tx.unshift({id:uid(),d:new Date().toISOString(),by:s.name,sid:s.id,kind:'Ahorro',amt:0,b:s.bal,a:s.bal,why:(d>0?'Ahorro de ':'Retiro de ahorro de ')+f(a)});if(d>0)s.pts+=5;save()},'Listo')}
function setGoal(){go(()=>{const t=parseFloat(val('gt'));if(!val('gn')||!(t>0))throw'Completa nombre y cantidad';stu(me.sid).goal={name:val('gn'),target:t,date:val('gd')};save()},'Meta guardada')}
function buy(id){const x=S.rewards.find(r=>r.id==id);if(!confirm('¿Comprar "'+x.name+'" por '+f(x.cost)+'?'))return;go(()=>{if(!x.on||!S.cfg.market)throw'Recompensa no disponible';op(me.sid,'Compra',x.cost,'Compra de recompensa: '+x.name);S.reqs.push({id:uid(),sid:me.sid,rid:id,name:x.name,cost:x.cost,st:'pending',d:new Date().toISOString()});save()},'¡Compra realizada! Espera la entrega del docente')}
function askL(){go(()=>{const a=r2(parseFloat(val('la'))),d=parseInt(val('ld'));if(!(a>0)||a>S.cfg.maxLoan)throw'Monto inválido (máx. '+f(S.cfg.maxLoan)+')';if(!val('lw'))throw'Escribe el motivo';if(!(d>0))throw'Plazo inválido';S.loans.push({id:uid(),sid:me.sid,amt:a,why:val('lw'),days:d,st:'pending',d:new Date().toISOString()});save()},'Solicitud enviada')}
function doCh(id){const c=S.chal.find(x=>x.id==id),s=stu(me.sid);go(()=>{if(s.done.includes(id))throw'Ya completaste este reto';op(s.id,'Reto',c.rew,'Reto completado: '+c.name);s.done.push(id);s.pts+=c.pts;save()},'¡Reto completado! 🏅')}
function ans(i){const s=stu(me.sid),p=document.querySelector('input[name=q'+i+']:checked');if(!p)return toast('Elige una respuesta',1);if(+p.value!=LES[i][4])return toast('Inténtalo de nuevo 💪',1);go(()=>{if(!s.les.includes(i)){s.les.push(i);s.pts+=10;save()}},'¡Correcto! +10 puntos')}
function give(m,sid){modal(`<h3>Entregar EduSoles</h3><label>Aula</label><select id="ga" onchange="gl()">${S.aulas.map(a=>`<option value="${e(a)}">${e(a)}</option>`)}</select><label>Modo</label><select id="gm" onchange="gl()"><option value="u">Un estudiante</option><option value="v">Varios estudiantes</option><option value="a">Toda el aula</option></select><div id="gs"></div><label>Cantidad por estudiante (E$)</label><input id="gq" type="number" min="1" step="0.5"><label>Tipo de operación</label><select id="gt">${INK.filter(x=>x!='Préstamo'&&x!='Reto').map(x=>`<option>${x}</option>`)}</select><label>Motivo</label><input id="gr"><p class="mu">Disponible en Tesorería: ${f(S.tre)}</p><button class="btn red" onclick="gdo()">Entregar</button>`);if(sid){$('ga').value=stu(sid).aula}if(m)$('gm').value=m;gl(sid)}
function gl(sid){const a=$('ga').value,m=$('gm').value;$('gs').innerHTML=S.students.filter(s=>s.aula==a).map(s=>`<label class="ck"><input type="checkbox" value="${s.id}" ${m=='a'||s.id==sid?'checked':''} ${m=='a'?'disabled':''}> ${e(s.name)}</label>`).join('')}
function gdo(){go(()=>{const a=$('ga').value,m=$('gm').value,amt=r2(parseFloat($('gq').value)),why=val('gr');let ids=m=='a'?S.students.filter(s=>s.aula==a).map(s=>s.id):[...$('gs').querySelectorAll('input:checked')].map(x=>+x.value);
 if(!ids.length)throw'Selecciona al menos un estudiante';if(m=='u'&&ids.length!=1)throw'Selecciona un solo estudiante';if(!(amt>0))throw'Cantidad inválida';if(!why)throw'Escribe el motivo';const tot=r2(amt*ids.length);if(tot>S.tre)throw'Total '+f(tot)+' supera la Tesorería ('+f(S.tre)+')';if(me.role=='docente'){const mm=new Date().getMonth(),us=sum(S.tx.filter(t=>t.by==me.name&&t.amt>0&&INK.includes(t.kind)&&!['Préstamo','Reto'].includes(t.kind)&&new Date(t.d).getMonth()==mm).map(t=>t.amt));if(us+tot>S.cfg.tope)throw'Superas tu tope mensual ('+f(S.cfg.tope)+'). Ya entregaste '+f(us)}
 if(!confirm('¿Entregar '+f(amt)+' a '+ids.length+' estudiante(s)? Total: '+f(tot)))throw'Operación cancelada';ids.forEach(i=>{op(i,$('gt').value,amt,why);stu(i).pts+=5});cm()},'EduSoles entregados')}
function wd(id){modal(`<h3>Retirar EduSoles — ${e(stu(id).name)}</h3><p class="mu">Disponible: ${f(avail(stu(id)))}. Los EduSoles regresan a la Tesorería.</p><label>Tipo</label><select id="wt"><option>Retiro</option><option>Reposición</option></select><p class="mu">Reposición: solo para reponer algo dañado o perdido (máx. 25% del saldo). Explica el motivo al estudiante.</p><label>Cantidad</label><input id="wq" type="number" min="1"><label>Motivo</label><input id="wr"><div class="btns"><button class="btn red" onclick="wdo(${id})">Retirar</button></div>`)}
function wdo(id){go(()=>{if(!val('wr'))throw'Escribe el motivo';const q=parseFloat($('wq').value),sx=stu(id);if($('wt').value=='Reposición'&&q>sx.bal*0.25)throw'La reposición no puede superar el 25% del saldo ('+f(sx.bal*0.25)+')';if(!confirm('¿Confirmar retiro?'))throw'Operación cancelada';op(id,$('wt').value,$('wq').value,val('wr'));cm()},'Retiro registrado')}
function apr(id){const l=S.loans.find(x=>x.id==id);modal(`<h3>Aprobar préstamo</h3><p>${e(stu(l.sid).name)}: ${e(l.why)}</p><label>Monto (E$)</label><input id="am" type="number" value="${l.amt}"><label>Plazo (días)</label><input id="ad" type="number" value="${l.days}"><div class="btns"><button class="btn" onclick="aprDo('${id}')">Aprobar y entregar</button></div>`)}
function aprDo(id){go(()=>{const l=S.loans.find(x=>x.id==id);if(l.st!='pending')throw'Ya fue procesado';const a=r2(parseFloat($('am').value)),d=parseInt($('ad').value);if(!(a>0)||!(d>0))throw'Datos inválidos';op(l.sid,'Préstamo',a,'Préstamo aprobado: '+l.why);l.amt=a;l.days=d;l.deb=r2(a*(1+(stu(l.sid).nivel=='Secundaria'?S.cfg.interes:0)/100));l.st='active';l.due=new Date(Date.now()+d*864e5).toISOString();save();cm()},'Préstamo aprobado')}
const rej=id=>go(()=>{const l=S.loans.find(x=>x.id==id);if(confirm('¿Rechazar?')){l.st='rejected';save()}});
function payL(id){go(()=>{const l=S.loans.find(x=>x.id==id),s=stu(l.sid);const D=l.deb||l.amt;if(!confirm('¿Registrar devolución de '+f(D)+'?'))throw'Operación cancelada';op(l.sid,'Devolución',D,'Devolución de préstamo');const late=Date.now()>new Date(l.due);l.st='paid';s.pts=Math.max(0,s.pts+(late?-15:30));save();toast(late?'Devuelto tarde: −15 puntos':'A tiempo: +30 puntos')})}
function newRew(){modal(`<h3>Nueva recompensa</h3><label>Icono (emoji)</label><input id="ri" value="🎁"><label>Nombre</label><input id="rn"><label>Costo (E$)</label><input id="rc" type="number" min="1"><div class="btns"><button class="btn" onclick="go(()=>{if(!val('rn')||!(parseFloat(val('rc'))>0))throw'Completa los datos';S.rewards.push({id:Date.now(),icon:val('ri'),name:val('rn'),cost:parseFloat(val('rc')),on:true});save();cm()},'Recompensa creada')">Crear</button></div>`)}
function newCh(){modal(`<h3>Nuevo reto</h3><label>Nombre</label><input id="hn"><label>Premio (E$)</label><input id="hr" type="number" min="1"><label>Puntos</label><input id="hp" type="number" min="1" value="20"><div class="btns"><button class="btn" onclick="go(()=>{if(!val('hn')||!(parseFloat(val('hr'))>0))throw'Completa los datos';S.chal.push({id:Date.now(),name:val('hn'),rew:parseFloat(val('hr')),pts:parseInt(val('hp'))||0});save();cm()},'Reto creado')">Crear</button></div>`)}
function newStu(){modal(`<h3>Nuevo estudiante</h3><label>Nombre completo</label><input id="nn"><label>Aula</label><select id="na">${S.aulas.map(a=>`<option>${e(a)}</option>`)}</select><label>Nivel</label><select id="nl"><option>Inicial</option><option selected>Primaria</option><option>Secundaria</option></select><div class="btns"><button class="btn" onclick="newStuDo()">Crear</button></div>`)}
function newStuDo(){go(()=>{const n=val('nn');if(n.length<3)throw'Escribe el nombre';const id=Math.max(...S.students.map(x=>x.id))+1,u=n.toLowerCase().replace(/\s+/g,'.').normalize('NFD').replace(/[^a-z.]/g,'');S.students.push({id,name:n,aula:$('na').value,nivel:$('nl').value,bal:0,sav:0,pts:0,goal:null,done:[],les:[]});S.users.push({u,p:'1234',role:'alumno',sid:id,name:n});save();if(S.cfg.initial>0)op(id,'Bono',S.cfg.initial,'EduSoles iniciales');cm();toast('Usuario: '+u+' / 1234')},'Estudiante creado')}
function newTch(){modal(`<h3>Nuevo docente</h3><label>Nombre</label><input id="tn"><label>Usuario</label><input id="tu"><div class="btns"><button class="btn" onclick="go(()=>{if(!val('tn')||!val('tu'))throw'Completa los datos';if(S.users.find(x=>x.u==val('tu')))throw'Usuario ya existe';S.teachers.push({name:val('tn'),u:val('tu')});S.users.push({u:val('tu'),p:'1234',role:'docente',name:val('tn')});save();cm()},'Docente creado (clave 1234)')">Crear</button></div>`)}
function addTxt(k,p){const v=prompt(p);if(v&&v.trim()){S[k].push(v.trim());save();render()}}
const newAula=()=>addTxt('aulas','Nombre del aula');
function saveCfg(){go(()=>{const m=parseFloat(val('c2')),i=parseFloat(val('c1')),a=parseFloat(val('c3'))||0;if(!(m>0)||i<0||a<0)throw'Valores inválidos';Object.assign(S.cfg,{rate:parseFloat(val('c7'))||0,interes:parseFloat(val('c8'))||0,tope:parseFloat(val('c9'))||500,initial:i,maxLoan:m,rank:$('c4').checked,market:$('c5').checked,loans:$('c6').checked});S.tre=r2(S.tre+a);save()},'Configuración guardada')}
render();
</script></body></html>
