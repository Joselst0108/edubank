<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduBank</title>
<style>
:root{--r:#d62839;--b:#17398c;--b2:#2f5fd0;--bg:#f2f5fb;--t:#1c2440;--mu:#6b7599}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
.shell{display:flex;min-height:100vh}.side{width:230px;background:linear-gradient(180deg,var(--b),#0e2461);color:#fff;padding:16px;flex:none}.logo{font-size:1.5rem;font-weight:800}.logo b{color:#ff6b7a}.side small{opacity:.7}
.side a{display:block;padding:10px 12px;margin:3px 0;border-radius:10px;color:#dfe7ff;cursor:pointer}.side a.on{background:#fff;color:var(--b);font-weight:700;box-shadow:inset 4px 0 var(--r)}
.main{flex:1;padding:18px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}.mu{color:var(--mu);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #1737a014}
.v{font-size:1.6rem;font-weight:800;color:var(--b)}.hero{background:linear-gradient(135deg,var(--b),var(--b2) 60%,var(--r));color:#fff}.hero .v{color:#fff;font-size:2.2rem}
.btn{background:var(--b);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}.btn.red{background:var(--r)}.btn.ghost{background:#e8eefc;color:var(--b)}.btn.sm{padding:5px 10px;font-size:.8rem}.btn.big{font-size:1.15rem;padding:15px 24px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px;border-bottom:1px solid #e8ecf6}th{color:var(--mu);font-size:.75rem;text-transform:uppercase}.sc{overflow-x:auto}
.pos{color:#12915a;font-weight:700}.neg{color:var(--r);font-weight:700}.tag{padding:2px 9px;border-radius:99px;font-size:.75rem;background:#e8eefc;color:var(--b)}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem}.ck{font-weight:400;margin:4px 0}input:not([type=checkbox]),select{width:100%;padding:10px;border:1px solid #cfd7ee;border-radius:10px;font:inherit}
#m{position:fixed;inset:0;background:#0a1230aa;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}#m.on{display:flex}#m .card{width:100%;max-width:460px;max-height:92vh;overflow:auto}
#t{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10}#t div{background:var(--b);color:#fff;padding:10px 18px;border-radius:10px;margin-top:6px}#t .er{background:var(--r)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--b),#0e2461 55%,var(--r));padding:14px}.login .card{max-width:400px;width:100%}
@media(max-width:800px){.shell{flex-direction:column}.side{width:100%;display:flex;gap:4px;overflow-x:auto;align-items:center}.side a{white-space:nowrap}.side .logo{margin-right:8px}.side small{display:none}}
</style></head><body><div id="app"></div><div id="m"></div><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(EDUBANK.url,EDUBANK.key);let P=null,view='';
const $=i=>document.getElementById(i),f=n=>'E$ '+Number(n||0).toFixed(2),val=i=>$(i).value.trim();
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>new Date(d).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}),nm=p=>e(((p&&p.nombres)||'')+' '+((p&&p.apellidos)||''));
const q=async p=>{const {data,error}=await p;if(error)throw error;return data},rpc=(n,a)=>q(sb.rpc(n,a));
function toast(m,er){const d=document.createElement('div');d.textContent=m;if(er)d.className='er';$('t').appendChild(d);setTimeout(()=>d.remove(),3500)}
async function run(fn,ok){try{await fn();ok&&toast(ok)}catch(x){toast(x.message||String(x),1);console.error(x)}render()}
const modal=h=>{$('m').innerHTML='<div class="card"><div class="btns"><button class="btn ghost sm" onclick="cm()">✕ Cerrar</button></div>'+h+'</div>';$('m').className='on'},cm=()=>$('m').className='';
const tb=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length} class="mu">Sin datos</td></tr>`}</table></div>`;
const kpi=(t,v,s)=>`<div class="card"><div class="mu">${t}</div><div class="v">${v}</div><div class="mu">${s||''}</div></div>`;
const NAV={superadmin:[['col','🏫','Colegios'],['usr','👤','Crear usuario']],admin:[['tre','🏦','Tesorería'],['est','🎓','Estudiantes'],['mov','📒','Movimientos'],['mkt','🛍️','EduMarket']],docente:[['tre','🏦','Tesorería'],['est','🎓','Estudiantes'],['mov','📒','Movimientos'],['mkt','🛍️','EduMarket']],estudiante:[['ini','🏠','Inicio'],['mov','📒','Movimientos'],['mkt','🛍️','Recompensas']]};
const staff=()=>['admin','docente'].includes(P.rol);
async function students(){const [a,b]=await Promise.all([q(sb.from('perfiles').select('id,nombres,apellidos,ahorro,puntos').eq('rol','estudiante').order('nombres')),q(sb.from('saldos').select('estudiante_id,saldo'))]);const m={};b.forEach(x=>m[x.estudiante_id]=+x.saldo);return a.map(x=>({...x,saldo:m[x.id]||0}))}
const tres=async()=>+(await q(sb.from('tesoreria').select('saldo').eq('colegio_id',P.colegio_id).single())).saldo;
const txRows=(a,n)=>a.map(t=>[fd(t.creado),...(n?[nm(t.est)]:[]),`<span class="tag">${e(t.tipo)}</span>`,`<span class="${t.monto>=0?'pos':'neg'}">${t.monto>=0?'+':'−'}${f(Math.abs(t.monto))}</span>`,f(t.saldo_anterior),f(t.saldo_posterior),e(t.motivo)]);
const TH=n=>['Fecha',...(n?['Estudiante']:[]),'Tipo','Monto','Saldo ant.','Saldo post.','Motivo'];
const movs=n=>q(sb.from('movimientos').select('*,est:perfiles!estudiante_id(nombres,apellidos)').order('creado',{ascending:false}).limit(100));
const V={
async col(){const c=await q(sb.from('colegios').select('*,tesoreria(saldo)').order('creado'));return`<h2>🏫 Colegios</h2><button class="btn red" onclick="newCol()">+ Crear colegio</button><div class="card" style="margin-top:12px">${tb(['Colegio','Plan','Tesorería','ID','Acción'],c.map(x=>[e(x.nombre),e(x.plan),f([].concat(x.tesoreria)[0]?.saldo),`<span class="mu">${x.id}</span>`,`<button class="btn sm" onclick="fondos('${x.id}')">Ajustar fondos</button>`]))}</div>`},
async usr(){
  const c=await q(sb.from('colegios').select('id,nombre'));
  const esSuper=P.rol==='superadmin';
  return`<h2>👤 Crear usuario</h2>
  <div class="card">
    <p class="mu">La cuenta se crea al instante. Comparte el correo y la contraseña con el usuario.</p>
    <label>Correo</label><input id="u0" type="email" placeholder="profesor@colegio.pe">
    <label>Contraseña temporal</label><input id="u1" type="text" value="123456">
    <label>Colegio</label>
    <select id="u2">${c.map(x=>`<option value="${x.id}">${e(x.nombre)}</option>`).join('')}</select>
    <label>Rol</label>
    <select id="u3">
      <option value="estudiante">Estudiante</option>
      <option value="docente">Docente</option>
      ${esSuper?'<option value="admin">Admin del colegio</option>':''}
    </select>
    <label>Nombres</label><input id="u4" placeholder="Ana">
    <label>Apellidos</label><input id="u5" placeholder="Torres">
    <div class="btns"><button class="btn" onclick="newUsr()">Crear usuario</button></div>
  </div>`},
async tre(){const [t,s]=await Promise.all([tres(),students()]),d=s.reduce((a,x)=>a+x.saldo,0),c=Math.round(d/((t+d)||1)*100);return`<h2>🏦 Tesorería EduBank</h2><div class="grid">${kpi('En Tesorería',f(t))}${kpi('Estudiantes',s.length)}${kpi('EduSoles distribuidos',f(d))}${kpi('Circulación',c+'%',c>70?'⚠️ Alta':'Saludable')}</div><div class="card"><div class="btns"><button class="btn red big" onclick="give()">+ ENTREGAR EDUSOLES</button></div><p class="mu">Los EduSoles solo salen de la Tesorería. Todo queda registrado.</p></div>`},
async est(){const s=await students();return`<h2>🎓 Estudiantes</h2><div class="card">${tb(['Nombre','Saldo','Ahorro','Puntos','Acciones'],s.map(x=>[nm(x),f(x.saldo),f(x.ahorro),x.puntos,`<button class="btn sm" onclick="give('${x.id}')">Entregar</button> <button class="btn sm red" onclick="wd('${x.id}')">Retirar</button>`]))}</div>`},
async mov(){const m=await movs();return`<h2>📒 Movimientos</h2><div class="card">${tb(TH(staff()),txRows(m,staff()))}</div>`},
async ini(){const [s]=await q(sb.from('saldos').select('saldo').eq('estudiante_id',P.id)),m=await movs(),sd=+(s?.saldo||0),g=m.filter(x=>x.monto>0).reduce((a,x)=>a+ +x.monto,0),ga=m.filter(x=>x.monto<0).reduce((a,x)=>a-x.monto,0);return`<div class="card hero"><div>Mi saldo</div><div class="v">${f(sd)}</div><div>${e(P.nombres)} · ${P.puntos} puntos</div></div><div class="grid" style="margin-top:12px">${kpi('Disponible',f(sd-P.ahorro))}${kpi('Ahorrado',f(P.ahorro))}${kpi('Dinero ganado',f(g))}${kpi('Dinero gastado',f(ga))}</div><div class="card"><h3>Mis movimientos</h3>${tb(TH(0),txRows(m.slice(0,6)))}</div>`},
async mkt(){const r=await q(sb.from('recompensas').select('*').order('costo')),c=await q(sb.from('canjes').select('*,est:perfiles(nombres,apellidos)').order('creado',{ascending:false}).limit(50));
 return`<h2>🛍️ EduMarket</h2>${staff()?'<button class="btn" onclick="newRew()">+ Nueva recompensa</button>':''}<div class="grid" style="margin-top:12px">${r.filter(x=>staff()||x.activa).map(x=>`<div class="card"><div style="font-size:2rem">${e(x.icono)}</div><b>${e(x.nombre)}</b><div class="pos">${f(x.costo)}</div>${staff()?`<button class="btn sm ghost" onclick="togRew('${x.id}',${!x.activa})">${x.activa?'Activa — desactivar':'Inactiva — activar'}</button>`:`<button class="btn sm red" onclick="buy('${x.id}','${e(x.nombre)}',${x.costo})">Comprar</button>`}</div>`).join('')}</div><div class="card"><h3>${staff()?'Solicitudes':'Mis compras'}</h3>${tb(['Fecha',...(staff()?['Estudiante']:[]),'Recompensa','Estado'],c.map(x=>[fd(x.creado),...(staff()?[nm(x.est)]:[]),e(x.nombre),x.estado=='entregado'?'<span class="tag">Entregada</span>':staff()?`<button class="btn sm" onclick="entr('${x.id}')">Entregar</button>`:'Esperando al docente']))}</div>`}};
async function render(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){P=null;$('app').innerHTML=`<div class="login"><div class="card"><div class="logo" style="color:var(--b)">Edu<b>Bank</b></div><p class="mu">Banco escolar virtual · Los EduSoles NO son dinero real</p><label>Correo</label><input id="le" type="email"><label>Contraseña</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><div class="btns"><button class="btn red" style="width:100%" onclick="login()">Ingresar</button></div></div></div>`;return}
 if(!P){const d=await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();P=d.data;if(P&&P.colegio_id){const c=await sb.from('colegios').select('nombre').eq('id',P.colegio_id).maybeSingle();P.colegios=c.data}if(!P){$('app').innerHTML=`<div class="login"><div class="card"><h3>Tu usuario aún no tiene perfil</h3><p>${d.error?'Error: '+e(d.error.message):'Pide al administrador que te vincule a un colegio.'}</p><p class="mu">Sesión: ${e(session.user.email)}</p><button class="btn" onclick="out()">Salir</button></div></div>`;return}}
 const nv=NAV[P.rol];if(!nv.find(n=>n[0]==view))view=nv[0][0];let h;try{h=await V[view]()}catch(x){h=`<div class="card">Error: ${e(x.message)}</div>`;console.error(x)}
 $('app').innerHTML=`<div class="shell"><nav class="side"><div class="logo">Edu<b>Bank</b></div><small>${e(P.colegios?.nombre||'Superadmin')}</small>${nv.map(n=>`<a class="${view==n[0]?'on':''}" onclick="view='${n[0]}';render()">${n[1]} ${n[2]}</a>`).join('')}</nav><div class="main"><div class="top"><div><b>${nm(P)}</b> <span class="tag">${P.rol}</span></div><button class="btn ghost sm" onclick="out()">Salir</button></div>${h}</div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:val('le'),password:$('lp').value});if(error)return toast('Correo o contraseña incorrectos',1);P=null;view='';render()}
async function out(){await sb.auth.signOut();P=null;view='';render()}
const newCol=()=>{const n=prompt('Nombre del colegio');if(!n)return;const fo=parseFloat(prompt('Fondo inicial de la Tesorería (E$)','10000'));run(()=>rpc('crear_colegio',{p_nombre:n,p_plan:'pro',p_fondo:fo||0}),'Colegio creado')};
const fondos=id=>{const m=parseFloat(prompt('Monto a sumar (negativo para restar)'));if(!m)return;const mo=prompt('Motivo');run(()=>rpc('ajustar_fondos',{p_colegio:id,p_monto:m,p_motivo:mo}),'Fondos ajustados')};
const newUsr=()=>run(async()=>{
  const email=val('u0'),pass=val('u1'),colegio=val('u2'),rol=val('u3'),nombres=val('u4'),apellidos=val('u5');
  if(!email||!pass||!nombres)throw{message:'Completa correo, contraseña y nombres'};
  if(pass.length<6)throw{message:'La contraseña debe tener al menos 6 caracteres'};
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch('/.netlify/functions/crear-usuario',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
    body:JSON.stringify({email,password:pass,colegio_id:colegio,rol,nombres,apellidos})
  });
  const json=await res.json();
  if(!res.ok)throw{message:json.error||'Error al crear usuario'};
  cm();
},'Usuario creado ✅');
async function give(id){const s=await students();modal(`<h3>Entregar EduSoles</h3><button class="btn ghost sm" onclick="document.querySelectorAll('#gs input').forEach(x=>x.checked=true)">Seleccionar toda el aula</button><div id="gs">${s.map(x=>`<label class="ck"><input type="checkbox" value="${x.id}" ${x.id==id?'checked':''}> ${nm(x)}</label>`).join('')}</div><label>Cantidad por estudiante (E$)</label><input id="gq" type="number" min="1" step="0.5"><label>Tipo</label><select id="gt">${['Premio','Bono','Participación','Asistencia','Tarea','Logro','Conducta','Incentivo','Otro'].map(x=>`<option>${x}</option>`)}</select><label>Motivo</label><input id="gr"><div class="btns"><button class="btn red" onclick="gdo()">Entregar</button></div>`)}
function gdo(){run(async()=>{const ids=[...document.querySelectorAll('#gs input:checked')].map(x=>x.value),a=parseFloat($('gq').value);if(!ids.length)throw{message:'Selecciona estudiantes'};if(!(a>0))throw{message:'Cantidad inválida'};if(!val('gr'))throw{message:'Escribe el motivo'};const t=await tres();if(a*ids.length>t)throw{message:'Total supera la Tesorería ('+f(t)+')'};if(!confirm('¿Entregar '+f(a)+' a '+ids.length+' estudiante(s)?'))throw{message:'Cancelado'};for(const i of ids)await rpc('entregar_edusoles',{p_est:i,p_tipo:$('gt').value,p_monto:a,p_motivo:val('gr'),p_clave:crypto.randomUUID()});cm()},'EduSoles entregados')}
const wd=id=>{const a=parseFloat(prompt('Cantidad a retirar (E$)'));if(!a)return;const t=confirm('Aceptar = Reposición (máx. 25% del saldo). Cancelar = Retiro.')?'Reposición':'Retiro',m=prompt('Motivo (obligatorio)');run(()=>rpc('entregar_edusoles',{p_est:id,p_tipo:t,p_monto:a,p_motivo:m,p_clave:crypto.randomUUID()}),'Retiro registrado')};
const buy=(id,n,c)=>{if(confirm('¿Comprar "'+n+'" por '+f(c)+'?'))run(()=>rpc('comprar_recompensa',{p_recompensa:id,p_clave:crypto.randomUUID()}),'¡Compra realizada!')};
const entr=id=>run(()=>q(sb.from('canjes').update({estado:'entregado'}).eq('id',id)),'Recompensa entregada');
const togRew=(id,v)=>run(()=>q(sb.from('recompensas').update({activa:v}).eq('id',id)));
const newRew=()=>{const n=prompt('Nombre de la recompensa'),c=parseFloat(prompt('Costo (E$)')),i=prompt('Icono (emoji)','🎁');if(n&&c>0)run(()=>q(sb.from('recompensas').insert({colegio_id:P.colegio_id,nombre:n,costo:c,icono:i||'🎁'})),'Recompensa creada')};
sb.auth.onAuthStateChange(()=>{});render();
</script></body></html>
