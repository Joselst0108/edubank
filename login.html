<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduBank | Acceso Seguro</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Google Fonts para una tipografía moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="loginpage">

  <div class="loginbox">
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <b>EduBank</b>
        <small>Banco Escolar Inteligente</small>
      </div>
    </div>

    <div class="tag">ACCESO SEGURO</div>
    <h1>Bienvenido de nuevo</h1>
    <p class="muted">Ingresa con tus credenciales institucionales para gestionar tu cuenta.</p>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="nombre@colegio.edu.pe" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="primary full" onclick="login()">Ingresar al Sistema →</button>

    <div id="error" class="errorbox" style="display: none;"></div>

    <p class="help">Autenticación segura gestionada directamente por Edubank</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
